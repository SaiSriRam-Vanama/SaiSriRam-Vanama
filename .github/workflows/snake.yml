# =====================================================================
#  🐍 GitHub Contribution Snake Animation Workflow
#  Generates an animated SVG of a snake eating your contribution graph
#  and publishes it to the "output" branch of this repository.
#
#  Uses the official, actively maintained generator: Platane/snk
#  https://github.com/Platane/snk
#
#  WHERE TO PLACE THIS FILE:
#  .github/workflows/snake.yml   (exactly this path, in your PROFILE repo
#  i.e. the repo named the same as your GitHub username)
# =====================================================================

name: Generate Snake Animation

on:
  # Re-generate automatically every 6 hours so the snake stays in sync
  # with your latest contributions
  schedule:
    - cron: "0 */6 * * *"

  # Allows manually triggering the workflow from the Actions tab
  workflow_dispatch:

  # Re-generate whenever you push to main (optional, safe to keep)
  push:
    branches:
      - main

permissions:
  contents: write   # required so the action can push to the "output" branch

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Snake SVG
        id: snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
